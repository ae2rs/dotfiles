[logging]
level = "debug"

[claude]
enabled = true
account = "max"

[copilot]
enabled = false

# Integrations that act on their own; scripts/install.sh asks about any missing here.
[rtk]
enabled = true

[notifications]
clickable = true

[web]
research = true

[keybindings]
"app.model.cycleForward" = ["shift+tab"]
"app.session.rename" = "ctrl+shift+r"

[jev]
enabled = false

[setup]
wezterm = true

[model]
default = "rho-claude/claude-opus-5-5"
enabled = [
  "rho-claude/claude-opus-5-5",
  "openai-codex/gpt-6.1-sol",
  "openai-codex/gpt-6-astra",
  "kimi-coding/k3",
  "prism/local/qwen3.8-flash-next-iq3_s",
]
thinking = "high"

[model.thinking_levels]
"rho-claude/claude-opus-5-5" = "high"

[providers.prism]                    # the household's model, through neti; see ~/perso/home/prism/README.md
api = "openai-completions"
base_url = "https://prism.factory.onl/v1"
auth = "neti"
client_id = "rho-prism"

[[providers.prism.models]]
context_window = 131072
id = "local/qwen3.8-flash-next-iq3_s"
max_tokens = 32768
name = "Qwen3.8 Flash Next (prism, IQ3_S)"
reasoning = true

[providers.prism.models.thinking_level_map]
high = "high"
low = "low"
medium = "medium"
off = "none"
xhigh = "xhigh"

[mcp.servers.slack]                  # app A0CBB675Z7T in amo-paris; see docs/mcp.md
url = "https://mcp.slack.com/mcp"
client_id = "4558880155776.12385211203265"
client_secret_env = "SLACK_MCP_CLIENT_SECRET" # in zsh/secrets/env.yaml (sops)
callback_port = 47823
disabled_tools = ["slack_schedule_message"]

[mcp.servers.lambda]                 # the household's mail, through neti; see ~/perso/home/lambda/README.md
url = "https://lambda.factory.onl/mcp"
client_id = "rho-lambda"
callback_port = 47830
proxy = "http://127.0.0.1:1056"     # only reachable through the home tailnet

# Services rho reads through the machine's own CLIs; profiles offer them through `resources`.
[actions]
enabled = true

[sentry]
org = "amoamoamo"

[k8s.contexts.home]
kubeconfig = "~/.kube/little-boy.yaml"
context = "little-boy"

[k8s.contexts.gke]
context = "gke_applications-5h1pm3n7_us-central1-b_us1b-applications"

# Home Prometheus, Loki and Tempo through Grafana's datasource proxy, signed in by hctl through
# neti; hctl reaches home through the home tailnet's proxy.
[query.sources.home]
kind = "prometheus"
command = ["hctl", "grafana", "api", "get", "api/datasources/proxy/uid/prometheus"]

[query.sources.home-logs]
kind = "loki"
command = ["hctl", "grafana", "api", "get", "api/datasources/proxy/uid/loki"]

[query.sources.home-traces]
kind = "tempo"
command = ["hctl", "grafana", "api", "get", "api/datasources/proxy/uid/tempo"]

[query.sources.mimir]                 # prod; needs the cluster's DNS
kind = "prometheus"
url = "http://mimir-nginx.monitoring/prometheus"

# Prod Cloud SQL as postgres, through the `pg` wrapper; rho keeps it read-only.
[query.sources.commerce]
kind = "postgres"
command = ["zsh", "-c", "source ~/.config/zsh/zshrc.d/50-aliases.zsh; pg commerce \"$@\"", "pg"]

[query.sources.users]
kind = "postgres"
command = ["zsh", "-c", "source ~/.config/zsh/zshrc.d/50-aliases.zsh; pg users \"$@\"", "pg"]

[profiles.base]
append_system_prompt = ["APPEND_SYSTEM.md", "RESPONSE_STYLE.md"]
instructions = ["AGENTS.md"]
skills = ["skills/adhd", "skills/design-ui", "skills/eddy-malou", "skills/google-rust-style"]
snippets = ["snippets"]
cleanup = "cleanup"
suggest = ["Requests name the file, crate or command they touch."]

[profiles.dotfiles]
suggest = [
  "Personal dotfiles, stowed into place: neovim configuration in Lua, zsh, and agent configuration under rho/.",
  '$ rho "add a which-key group for the diffview mappings"',
  '$ rho "make lualine show the current macro register"',
]

[profiles.infrastructure]
skills = ["skills/linear"]
resources = ["linear", "actions", "k8s", "query"]

[profiles.monorepo]
instructions = ["profiles/monorepo.md"]
skills = [
  "skills/deploy-monorepo",
  "skills/regenerate-sqlx-cache",
  "skills/linear",
  "skills/rerun-codex-review",
  "skills/prepare-review",
]
snippets = ["snippets/monorepo"]
resources = ["linear", "actions", "sentry", "k8s", "query"]
cleanup = "cleanup-monorepo"
suggest = [
  "A Bazel monorepo: Rust under rs/ (engine, mobile, platform, proto, geodata), a TypeScript web app under web/, iosapp/ and android/.",
  "Backend services live under rs/engine/api/back/.",
  '$ rho "run clippy on the bump crate"',
  '$ rho "regenerate the sqlx cache after the migration"',
  '$ rho "why does the backend release workflow push an image on every PR"',
  '$ rho "add a redis-backed store test for the invite repository"',
]

# [[profiles.monorepo.always_ask]]
# match = '\bgit\s+merge\b'
# reason = "merges into the checked-out branch"

# [[profiles.monorepo.always_ask]]
# match = '\bgit\s+push\b.*\b(main|master)\b'
# reason = "pushes to main"

# [[profiles.monorepo.always_ask]]
# match = '\bgh\s+pr\s+merge\b'
# reason = "merges a pull request into main"

[profiles.home]
resources = ["actions", "k8s", "query"]

[profiles.neo]
instructions = ["profiles/neo.md"]

[profiles.rho]
suggest = [
  "rho is a terminal coding agent written in Rust, with a ratatui front end.",
  "Crates under crates/: rho-tui for the terminal, plus rho-agent, rho-provider, rho-model, rho-session, rho-extensions, rho-copilot.",
  "The terminal has a prompt editor, a transcript, a footer, a session tree, a model picker and a completion menu.",
  '$ rho "make the footer show the git branch next to the model"',
  '$ rho "add a test for the markdown renderer at 40 columns"',
  '$ rho "why does the completion menu close when I type a slash"',
  '$ rho "the session tree should indent only actual forks"',
]

[[profiles.rules]]
directory = "/Users/lucas/work/monorepo"
profile = "monorepo"

[[profiles.rules]]
origin = "wesprint-io/monorepo"
profile = "monorepo"

[[profiles.rules]]
origin = "wesprint-io/infrastructure"
profile = "infrastructure"

[[profiles.rules]]
origin = "ae2rs/neo"
profile = "neo"

[[profiles.rules]]
origin = "ae2rs/home"
profile = "home"

[[profiles.rules]]
origin = "ae2rs/rho"
profile = "rho"

[[profiles.rules]]
origin = "ae2rs/dotfiles"
profile = "dotfiles"

[server]
upstream = "wss://agora.factory.onl"

# The hostname changes with the network: Tailscale's home tailnet turns it into a ts.net name.
[machine]
name = "Lucass-MacBook-Pro.local"

# Each repository's cap; a writer subagent on a branch takes one.
[worktrees]
slots = 5

[memory]
engram_url = "https://agora.factory.onl"
